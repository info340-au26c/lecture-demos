<!DOCTYPE html>
<html>
<head>
  <title>Semantic HTML</title>
  <!-- External stylesheet/CSS  -->
  <link href="./css/styles.css" rel="stylesheet">

  <style>
    /* Internal stylesheet/CSS */
  </style>
</head>
<body>
  <h3>This is my third Header</h3>
  <p>This is an intro paragraph</p>
  <!-- this tag uses: Inline CSS -->
  <section>
    <p style="font-size: larger">This is some other text. But really this is just another paragraph in my long story. when you do this, it's not actually a paragraph, it's actually going to be treated as a header.</p>
  </section>
  <p>
    <a href="https://google.com">First link.</a> And then there's
    <a href="https://google.com">Second link.</a>
  </p>
</body>
</html>
